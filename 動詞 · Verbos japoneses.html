D.forEach(d=>{const r=RJ[d.k]||["",""];d.rf=r[0];d.ri=r[1]});
D.sort((a,b)=>LV.findIndex(x=>x[0]==a.c)-LV.findIndex(x=>x[0]==b.c));let cur="all";
const $=id=>document.getElementById(id);
const grp=()=>cur=="all"?D:D.filter(d=>d.c==cur);
function render(){
 $("nav").innerHTML=LV.map(([v,t])=>`<button class="f ${v==cur?"on":""}" data-v="${v}">${t}</button>`).join("");
 document.querySelectorAll(".f").forEach(b=>b.onclick=()=>{cur=b.dataset.v;render()});
 const g=grp();
 $("qb").textContent="Quiz rápido · "+LV.find(x=>x[0]==cur)[1];
 $("cnt").textContent=g.length+" verbos";
 $("grid").innerHTML=g.map(d=>{const c=conj(d),r=conj(d,d.h);return`<div class="c"><div class="in"><div class="s fr"><div><b>${d.k}</b><div class="h jp">${d.h}</div><div class="ro"><i>${ro(d.h)}</i></div><small>${d.m}</small></div></div>
 <div class="s bk"><p><b style="font-size:1.4rem;color:var(--red)">${d.k}</b> <span class="jp">${d.h}</span> <i>(${ro(d.h)})</i><br><b>${d.m}</b> <span class="tag">${GN[d.g]}</span></p>
 <table class="jp"><tr><th></th><th>Informal</th><th>Formal</th></tr><tr><td>Presente</td><td>${X(c.p[0],r.p[0])}</td><td>${X(c.p[1],r.p[1])}</td></tr><tr><td>Negativo</td><td>${X(c.n[0],r.n[0])}</td><td>${X(c.n[1],r.n[1])}</td></tr><tr><td>Pasado</td><td>${X(c.t[0],r.t[0])}</td><td>${X(c.t[1],r.t[1])}</td></tr><tr><td>Forma て</td><td colspan="2">${X(c.te,r.te)}</td></tr></table>
 <p><span class="lb">FORMAL · です/ます</span><br><span class="ex jp">${d.f}</span><br><i>${d.rf}</i><br>${d.fe}</p>
 <p><span class="lb">INFORMAL · forma simple</span><br><span class="ex jp">${d.i}</span><br><i>${d.ri}</i><br>${d.ie}</p></div></div></div>`}).join("");
 document.querySelectorAll(".c").forEach(c=>c.onclick=()=>c.classList.toggle("fl"));
}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let Q=[],i=0,sc=0;
$("qb").onclick=()=>{Q=shuf(grp()).slice(0,10);i=0;sc=0;$("home").hidden=true;$("quiz").hidden=false;ask()};
function ask(){
 const q=Q[i],cj=conj(q);
 // alternate: meaning questions and conjugation questions
 const kinds=[["Formal (presente)",cj.p[1]],["Informal negativo",cj.n[0]],["Informal pasado",cj.t[0]],["Formal pasado",cj.t[1]],["Formal negativo",cj.n[1]],["Forma て",cj.te]];
 const conjQ=i%2==1?kinds[Math.floor(Math.random()*kinds.length)]:null;
 let ans,opts,title;
 if(conjQ){ans=conjQ[1];title="¿Cuál es la forma «"+conjQ[0]+"»?";
  opts=shuf([...new Set([cj.p[0],cj.p[1],cj.n[0],cj.n[1],cj.t[0],cj.t[1],cj.te])].filter(x=>x!=ans)).slice(0,3);opts=shuf([ans,...opts])}
 else{ans=q.m;title="¿Qué significa?";opts=shuf([q.m,...shuf([...new Set(D.map(d=>d.m))].filter(m=>m!=q.m)).slice(0,3)])}
 $("quiz").innerHTML=`<div class="cnt">Pregunta ${i+1} de ${Q.length}</div><div class="big">${q.k}</div><div class="cnt jp" style="font-size:1.2rem">${q.h} (${ro(q.h)})${conjQ?" · "+q.m:""}</div><p>${title}</p>`+
 opts.map(o=>`<button class="o jp">${o}</button>`).join("")+`<div class="msg" id="msg"></div><button class="q" id="nx" hidden>Siguiente</button>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
  const ok=b.textContent==ans;if(ok)sc++;
  document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent==ans)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  $("msg").textContent=ok?"✔ ¡Correcto!":"✘ Incorrecto. Respuesta correcta: "+ans;
  $("msg").style.color=ok?"var(--ok)":"var(--bad)";
  $("nx").hidden=false;$("nx").textContent=i+1<Q.length?"Siguiente":"Ver puntaje";
  $("nx").onclick=()=>{i++;i<Q.length?ask():end()};
 });
}
function end(){
 $("quiz").innerHTML=`<div class="sun">${sc}</div><h2>Puntaje: ${sc} / ${Q.length}</h2><button class="q" id="bk">Volver a las tarjetas</button>`;
 $("bk").onclick=()=>{$("quiz").hidden=true;$("home").hidden=false;render()};
}
render();
</script></body></html>
